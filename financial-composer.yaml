version: "3.8"

services:
  financial-app:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: financial-app
    restart: always
    networks:
      - n8n-net
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_N8N_API_KEY=${VITE_N8N_API_KEY}
      - VITE_DEFAULT_FROM=${VITE_DEFAULT_FROM}
      - VITE_DEFAULT_TO=${VITE_DEFAULT_TO}
      - TZ=${TZ}
    ports:
      - "3002:80"

  financial-app-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: financial-app-tunnel
    restart: always
    networks:
      - n8n-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TZ=${TZ}
    depends_on:
      - financial-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n-net:
    external: true