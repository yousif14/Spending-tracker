version: "3.8"

services:
  financial-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-app
    restart: always
    networks:
      - n8n-net
    environment:
      - TZ=${TZ}
      - FA_API_KEY=${FA_API_KEY}
    ports:
      - "3002:80"

  financial-app-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: financial-app-tunnel
    restart: always
    networks:
      - n8n-net
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TZ=${TZ}
    depends_on:
      - financial-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n-net:
    external: true